# Raise the journal size cap for the QCA9377 Bluetooth investigation.
#
# systemd's default SystemMaxUse is min(10% of the filesystem, 4 GB), which on
# this machine means 4 GB. With verbose Bluetooth debugging enabled that is a
# few days of retention, and the hang under investigation appears at intervals
# of hours to days — so the evidence for an incident can be rotated away before
# anyone looks at it. This has already happened once with the HCI captures.
#
# 16 GB against 88 GB free is a deliberate trade: disk is cheap here, and a
# reboot-to-recover bug is only debuggable if the logs from before the reboot
# survive it.
#
# SystemKeepFree is the safety net that matters. It is enforced independently of
# SystemMaxUse, so even if the cap were set wrongly the journal will not push
# the root filesystem below the reserve.
#
# Revert by deleting this file and running: systemctl restart systemd-journald

# REVIEWED-KEEP 2026-08-15T1752Z 2.4: the warning below is written in blood —
# 16 boots of hang history. It stays with this file forever.
# DO NOT ADD MaxRetentionSec HERE.
#
# An earlier version of this file set MaxRetentionSec=1month, intending it as a
# generous bound. It is not a bound — it is an instruction to DELETE anything
# older, and journald acts on it the moment it restarts. Applying this file cost
# 16 boots of hang history (34 -> 18) in the second it took to reload, in a file
# whose entire purpose was to retain MORE history.
#
# Size caps discard oldest-first only when the cap is actually reached. Age caps
# discard immediately and unconditionally. For an investigation into a bug that
# recurs over weeks, only the size cap is wanted.

[Journal]
Storage=persistent
SystemMaxUse=16G
SystemKeepFree=20G
