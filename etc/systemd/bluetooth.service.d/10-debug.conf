# Run bluetoothd with debug logging for the QCA9377 investigation.
#
# WHY. At default verbosity bluetoothd records almost nothing about what the
# operator did. Reconstructing a test session from the journal turned up panel
# launches, a couple of profile errors and the failures themselves — but no
# connect, no disconnect, no pairing, no profile switch. Those are exactly the
# actions whose ORDER matters when characterising a bug that follows repeated
# connect/disconnect cycles, and they were unrecoverable afterwards.
#
# -d enables bluetoothd's own debug output, which includes device connection
# state changes, profile connect and disconnect, pairing and authentication
# steps, and AVDTP/A2DP stream setup. That is the layer between "the operator
# clicked something" and "the controller stopped answering".
#
# COST. Verbose, but bluetoothd logs per event rather than per packet, so the
# volume is bounded by activity rather than by audio bandwidth. It is the
# journal size cap (see journald.conf.d/10-bt-investigation.conf) that keeps
# this affordable.
#
# NOTE this is an override, not an edit: the packaged unit file is untouched, so
# reverting is deleting this file plus `systemctl daemon-reload`.

[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd -d
