# QCA9377 (13d3:3503) Bluetooth stability.
#
# USB autosuspend races against in-flight HCI traffic on QCA ROME firmware.
# The observed hang on this host was triggered by an A2DP stream torn down
# mid-playback, precisely the window where a runtime suspend/resume can land.
#
# Applies at module load; see also
#   /etc/udev/rules.d/50-bluetooth-no-autosuspend.rules
# which pins power/control=on for the device itself at hotplug time.
#
# Rollback: delete this file, then `update-initramfs -u` is NOT required
# (btusb is not in the initramfs); just reboot or reload btusb.
#
# Investigation: docs/investigation.md
options btusb enable_autosuspend=0
