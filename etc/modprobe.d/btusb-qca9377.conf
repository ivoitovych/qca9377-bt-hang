# QCA9377 (13d3:3503) Bluetooth stability.
#
# USB autosuspend races against in-flight HCI traffic on QCA ROME firmware.
# The observed hang on this host was triggered by an A2DP stream torn down
# mid-playback, precisely the window where a runtime suspend/resume can land.
#
# Applies at module load; see also
#   /etc/udev/rules.d/50-bluetooth-no-autosuspend.rules
# which pins power/control=on for the device itself at hotplug time.
#
# Rollback: delete this file, then `update-initramfs -u` is NOT required
# (btusb is not in the initramfs); just reboot or reload btusb.
#
# Investigation: docs/investigation.md
options btusb enable_autosuspend=0

# REVIEWED-KEEP 2026-08-15T1752Z 2.4: dyndbg at MODULE LOAD is the only hook
# early enough for probe-time lines, and the per-file query below deliberately
# excludes the per-packet files. Both halves are measured decisions.
# --- dynamic debug from module load ----------------------------------------
#
# bt-dyndbg.service is ordered before bluetooth.service, which is early enough
# to catch the daemon but NOT early enough to catch the driver: on this machine
# btusb loaded at 04:40:30.52 and the service ran at 04:40:33.23, so probe and
# the initial HCI exchange had already happened three seconds earlier. Anything
# that only occurs once at bring-up — btusb_setup_qca() and the firmware
# download on a matched device, the first command round-trip on any device —
# was therefore invisible.
#
# The dyndbg module parameter is applied by the dynamic-debug core *as the
# module loads*, which is the only hook early enough. bt-dyndbg.service stays,
# because it still covers the case where btusb is reloaded by hand.
options btusb dyndbg=+p

# bluetooth.ko contains hci_core.c, hci_sync.c and hci_conn.c together with
# hci_event.c and l2cap_core.c. A bare "+p" would therefore switch on the two
# per-packet files this investigation deliberately excludes — 364 sites firing
# once per received event and per L2CAP packet, which is unaffordable during
# audio and, more seriously, adds work to the receive path of a bug measured in
# timing. The query syntax selects files individually.
options bluetooth dyndbg="file hci_core.c +p; file hci_sync.c +p; file hci_conn.c +p"
