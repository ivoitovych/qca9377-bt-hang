# The gate that devtools/check runs locally, run on every push and PR.
#
# WHY. Nothing in this repository ran unless a human remembered to run it, and
# the history says that is not enough: the pipefail/grep -q inversion reached
# six shipped decisions, and a hand-written path list missed install.sh twice.
# Both were caught by review, later, after the wrong numbers had been quoted.
#
# The suite is ~2 s and hermetic — it sandboxes bt-trial, stubs bt-incident and
# asserts that evidence/sessions/ is unchanged afterwards — so there is no
# reason for it not to run on every push.

name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The invariants derive the file set from `git ls-files`, so the checkout
      # must be a real repository. actions/checkout gives one at depth 1, which
      # is enough — nothing here reads history.
      # gawk, because ubuntu-latest ships mawk as `awk` and mawk 1.3.4 cannot
      # express the redaction patterns in tools/sanitize-logs.sh — it treats an
      # interval on a group as `+`, so `11:22` matches the MAC pattern while a
      # real address is only partly replaced. The tool detects that and refuses,
      # which is correct but means the redaction assertions would SKIP on every
      # CI run. The gate that keeps Wi-Fi BSSIDs out of a public repository is
      # not one to leave untested because of the default awk.
      - name: Install gawk
        run: sudo apt-get install -y gawk

      - name: Show the tool versions the results depend on
        run: |
          bash --version | head -1
          awk --version 2>/dev/null | head -1 || awk -W version 2>&1 | head -1
          command -v systemd-analyze >/dev/null && echo "systemd-analyze: present" \
                                                || echo "systemd-analyze: absent (unit checks will skip)"

      # bash -n, awk parse, unit/udev/json/python validation, and the suite.
      # repo-validate skips any checker that is not installed rather than
      # failing — a runner without systemd must not turn nine unit files red.
      - name: repo-validate (syntax, awk parse, invariants, doc drift)
        run: devtools/repo-validate .

      # Belt and braces: repo-validate runs the suite, but a failure there is
      # reported as one line. Running it directly puts the failing invariant in
      # the log where the annotation points.
      - name: tests/run-tests
        run: tests/run-tests

      # A RATCHET, NOT A TARGET. The floor sits a little below the current
      # figure so ordinary work cannot trip it, and it rises only when a stage
      # lands. Its job is to stop coverage falling silently as tools grow —
      # "every test encodes a defect that shipped" remains the actual rule.
      - name: coverage floor
        run: devtools/coverage --quiet --min 30

      # The full-tree scan, which this workflow originally had to leave out.
      #
      # It was omitted because `repo-scan` falls back to scanning ALL tracked
      # files when nothing is staged — the state of a CI checkout — and it then
      # failed on two items that predated the workflow: a kernel MODULE_AUTHOR
      # address and a filesystem UUID carried in a sanitised log. Neither was a
      # leak, but settling them was a publish-safety decision rather than a
      # testing one, and a step that is red on its first run teaches everyone
      # to ignore it.
      #
      # They have since been settled on main, and `devtools/check` now gates on
      # `repo-scan . --all` locally. CI enforces the same thing, so a pull
      # request from a fork is screened before anyone reads it.
      - name: repo-scan (publish safety, full tree)
        run: devtools/repo-scan . --all
