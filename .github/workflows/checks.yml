# The gate that devtools/check runs locally, run on every push and PR.
#
# WHY. Nothing in this repository ran unless a human remembered to run it, and
# the history says that is not enough: the pipefail/grep -q inversion reached
# six shipped decisions, and a hand-written path list missed install.sh twice.
# Both were caught by review, later, after the wrong numbers had been quoted.
#
# The suite takes about a minute and runs on every push. It is hermetic, and
# that is MEASURED rather than claimed: a step below runs it in a decoy
# world (devtools/sandbox) and fails on any call of a machine tool, any read of
# a machine file, any write to a real directory. This line said "~2 s and
# hermetic" until 2026-09-29, when the first such run counted 312 calls of real
# machine tools per suite run and 12 verdicts that changed with the machine.

name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The invariants derive the file set from `git ls-files`, so the checkout
      # must be a real repository. actions/checkout gives one at depth 1, which
      # is enough — nothing here reads history.
      # gawk, because ubuntu-latest ships mawk as `awk` and mawk 1.3.4 cannot
      # express the redaction patterns in tools/sanitize-logs.sh — it treats an
      # interval on a group as `+`, so `11:22` matches the MAC pattern while a
      # real address is only partly replaced. The tool detects that and refuses,
      # which is correct but means the redaction assertions would SKIP on every
      # CI run. The gate that keeps Wi-Fi BSSIDs out of a public repository is
      # not one to leave untested because of the default awk.
      #
      # fakeroot, because the runner runs the suite as an ordinary user and
      # `tools/bt-mode` refuses to act without EUID 0 — correctly, since in
      # production it moves files in /etc and stops a unit. Its whole round trip
      # is seamed into a temp tree under test, so a reported uid of 0 is all it
      # needs, and fakeroot supplies that through an LD_PRELOAD while granting
      # nothing. The suite prefers `unshare -r`, which asks for even less, but
      # this image is Ubuntu 24.04 and AppArmor there refuses unprivileged user
      # namespaces; without a third option the suite declines the round trip and
      # the comprehensiveness floor fails on a unit at 0%. sudo is NOT the third
      # option: it resets the environment and closes the descriptor the coverage
      # trace is written to, so the round trip would run and be measured as
      # never having run.
      - name: Install gawk, systemd-journal-remote and fakeroot
        run: sudo apt-get install -y gawk systemd-journal-remote fakeroot

      - name: Show the tool versions the results depend on
        run: |
          bash --version | head -1
          awk --version 2>/dev/null | head -1 || awk -W version 2>&1 | head -1
          command -v systemd-analyze >/dev/null && echo "systemd-analyze: present" \
                                                || echo "systemd-analyze: absent (unit checks will skip)"

      # bash -n, awk parse, unit/udev/json/python validation, and the suite.
      # repo-validate skips any checker that is not installed rather than
      # failing — a runner without systemd must not turn the unit files red.
      - name: repo-validate (syntax, awk parse, invariants, doc drift)
        run: devtools/repo-validate .

      # Belt and braces: repo-validate runs the suite and prints its whole output
      # on a failure, inside its own report. Running it directly gives the suite
      # its own step, so a red one names the suite and not the validator.
      - name: tests/run-tests
        run: tests/run-tests

      # A RATCHET, NOT A TARGET. The floor sits a little below the current
      # figure so ordinary work cannot trip it, and it rises only when a stage
      # lands. Its job is to stop coverage falling silently as tools grow —
      # "every test encodes a defect that shipped" remains the actual rule.
      - name: coverage floor
        run: devtools/coverage --quiet --min 80

      # A SECOND MEASUREMENT, of a different language. devtools/coverage
      # measures bash with xtrace, and bash traces commands — a 180-line awk
      # program is one command, so the awk this project computes its answers in
      # was invisible to it. This reads gawk --profile instead and reports
      # statement coverage. It found that the classifier branches for stage 2
      # of the bug had never executed.
      - name: awk statement coverage floor
        run: devtools/awk-coverage --min 85

      # A THIRD LANGUAGE, AND THE SAME ARGUMENT. bin/bt-capture is Python and
      # neither instrument above could see it — `TX-04`, open from 2026-08-15 to
      # 08-22 as "instrument or state it", closed by this step; it now measures
      # devtools' Python too. bt-capture is the capture that SURVIVES btmon's 67
      # aborts a boot, and the btsnoop it writes is what bt-capdiff and every
      # later analysis read, so an encoding error here surfaces at READ time on
      # evidence that cannot be recaptured. stdlib `trace` via a generated
      # sitecustomize, which is Python's BASH_ENV.
      - name: python line coverage floor
        run: devtools/py-coverage --min 80

      # A RATCHET ON THE OTHER AXIS. Line coverage cannot see a unit that was
      # never invoked in a mode it has: bt-window sat at 0 of 45 lines while
      # the suite was green and the total moved by a fraction of a point.
      # The floor is the WEAKEST dimension of the WORST unit, set a little
      # below where the tree stands so it catches a regression rather than
      # blocking ordinary work.
      - name: comprehensiveness floor
        run: devtools/test-comprehension --min 75

      # Phase 1 checks the host journal's shapes, and runs here (this runner has
      # a journal; it skips only on a host without one). Phase 2 builds a real
      # journal from text and byte-compares real journalctl output against the
      # fixture grammar, which is why systemd-journal-remote is installed above.
      - name: journal contract
        run: devtools/journal-contract

      # THE LEAK DETECTOR'S OWN TEST. devtools/sandbox runs the suite in a decoy
      # world (devtools/README.md) and reports every place it reached for the
      # real machine; before its verdicts mean anything, it must catch a leak
      # planted for every detector and every decoy, and each isolation probe
      # must first reach its target from the host. It needs unprivileged user
      # namespaces, which Ubuntu 24.04's AppArmor refuses by default: lifted
      # HERE, after the steps above have measured the suite the way it runs on
      # the laptop (fakeroot, no namespaces), so none of their results change.
      #
      - name: sandbox self-test (the leak detector catches every planted leak)
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          devtools/sandbox --self-test

      # THE MUTATION HARNESS'S OWN TEST. devtools/mutate judges whether the
      # suite notices a changed decision; a verdict is only worth the mutant,
      # and its first real run applied every dropped `!` wrongly with a report
      # that looked like any other. --self-test runs it on a repository it
      # builds and pins what each mutant applied. It needs the namespaces
      # lifted in the step above. Neither self-test runs inside tests/run-tests:
      # these two steps are where they run.
      - name: mutate self-test (each mutant applied exactly as listed)
        run: devtools/mutate --self-test

      # THE SUITE IN THE DECOY WORLD. Every machine tool, every installed file,
      # /sys, /proc, /run and /var/log answer with a per-run marker; every real
      # directory sits under a throwaway overlay. Exit 4 on any call, marked
      # output, read or write — each listed with its caller. The one sanctioned
      # door, real_tool() in the suite, is listed apart and not counted. This
      # runner, unlike a bare development host, has a live
      # systemd, journald and D-Bus: exactly the machine a leak would reach.
      - name: suite in the decoy world (no verdict from the machine)
        run: devtools/sandbox

      # THE SYSTEM ROUND TRIP — with the rehearsal below, the steps that install
      # on the machine (the package and sysctl steps above change it too).
      #
      # It installs for real, uninstalls for real, and checks that no
      # install_file destination is left: install.sh's claim that "uninstalling
      # is a complete restoration", which no amount of reading either script can
      # settle because it is a property of the PAIR. Here, without bluez, its
      # bt-verify-install and verify-restored.sh checks skip, and its direct
      # check does not see the files install.sh writes by redirect; the
      # rehearsal's snapshot below does. It skipped on every run, and passed,
      # until 2026-10-16: it asked `systemctl is-system-running`, which exits
      # non-zero for `degraded`.
      #
      # Safe HERE and nowhere else by construction. The runner is an ephemeral
      # VM with a live systemd; the test refuses unless BT_SYSTEM_TEST=1 is set
      # explicitly AND the host carries no existing installation, no open trial
      # and no experiment mode. The investigation machine fails those gates
      # even if someone sets the variable.
      - name: system round trip (installs for real, then removes itself)
        run: sudo BT_SYSTEM_TEST=1 tests/system-roundtrip

      # THE INVESTIGATION MACHINE'S NEXT DEPLOY, REHEARSED. That machine runs
      # the 2026-09-18 tools (cccf0fe: its installed bt-trial is that commit's
      # blob, docs/STATUS.md), has a trial open, and will be upgraded with
      # --tools-only. The round trip above installs onto a clean machine and
      # sees none of that. Here the old tree is installed for real, a trial is
      # opened by the old bt-trial, this checkout is deployed over it with
      # --tools-only, systemd reloads, the trial unit is stopped as a shutdown
      # stops it, and the pair is uninstalled — in both modes the machine can
      # be in. Same gates as the round trip, plus the investigation machine's
      # checkout path. The old commit is fetched by its full id: it is not in
      # main's history.
      - name: deploy rehearsal (the 2026-09-18 tools, a trial open, --tools-only), mitigation mode
        run: |
          git fetch --no-tags --depth=1 origin cccf0fe0b7871c1898807c4b25a85adbc27fd9cf
          mkdir -p "$RUNNER_TEMP/installed-20260918"
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/installed-20260918"
          sudo BT_SYSTEM_TEST=1 tests/system-upgrade "$RUNNER_TEMP/installed-20260918" mitigation
      - name: deploy rehearsal, experiment mode (bt-mode experiment before the deploy)
        run: sudo BT_SYSTEM_TEST=1 tests/system-upgrade "$RUNNER_TEMP/installed-20260918" experiment

      # The full-tree scan, which this workflow originally had to leave out.
      #
      # It was omitted because `repo-scan` falls back to scanning ALL tracked
      # files when nothing is staged — the state of a CI checkout — and it then
      # failed on two items that predated the workflow: a kernel MODULE_AUTHOR
      # address and a filesystem UUID carried in a sanitised log. Neither was a
      # leak, but settling them was a publish-safety decision rather than a
      # testing one, and a step that is red on its first run teaches everyone
      # to ignore it.
      #
      # They have since been settled on main, and `devtools/check` now gates on
      # `repo-scan . --all` locally. CI enforces the same thing, so a pull
      # request from a fork is screened before anyone reads it.
      - name: repo-scan (publish safety, full tree)
        run: devtools/repo-scan . --all
