# The gate that devtools/check runs locally, run on every push and PR.
#
# WHY. Nothing in this repository ran unless a human remembered to run it, and
# the history says that is not enough: the pipefail/grep -q inversion reached
# six shipped decisions, and a hand-written path list missed install.sh twice.
# Both were caught by review, later, after the wrong numbers had been quoted.
#
# The suite takes about a minute and runs on every push. It is hermetic, and
# that is MEASURED rather than claimed: a step below runs it in a decoy
# world (devtools/sandbox) and fails on any call of a machine tool, any read of
# a machine file, any write to a real directory. This line said "~2 s and
# hermetic" until 2026-09-29, when the first such run counted 312 calls of real
# machine tools per suite run and 12 verdicts that changed with the machine.

name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CI-ONLY BRANCH: the deploy rehearsal alone, 20 times in each mode, to
      # see whether its unit check still catches a restart loop's phases.
      - name: deploy rehearsal, repeated
        run: |
          git fetch --no-tags --depth=1 origin cccf0fe0b7871c1898807c4b25a85adbc27fd9cf
          mkdir -p "$RUNNER_TEMP/installed-20260918"
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/installed-20260918"
          fails=0
          for i in $(seq 1 20); do
            for m in mitigation experiment; do
              if out=$(sudo BT_SYSTEM_TEST=1 tests/system-upgrade "$RUNNER_TEMP/installed-20260918" $m 2>&1); then
                echo "run $i $m: $(tail -1 <<<"$out")"
              else
                fails=$((fails + 1)); echo "run $i $m: FAILED"; grep -A4 '✗' <<<"$out"
              fi
            done
          done
          echo "failures: $fails of 40"
          [ "$fails" -eq 0 ]
